<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
<title>자동투자</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a6fdb'/%3E%3Cpath d='M12 44 L26 30 L36 38 L52 18' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- 공개 페이지: 로그인 화면과 보여 주는 틀만 있음. 숫자는 로그인한 가족에게만 상지홈 DB(RLS)에서 내려옴 -->
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#141413;--ink2:#4d4c48;--muted:#8a8984;--line:#e4e2db;--acc:#2a6fdb;--warnbg:#fbf0d9;--warn:#9a6200;--alertbg:#fbe3e0;--alert:#a32116}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0e;--card:#1b1b1a;--ink:#f1f0ec;--ink2:#c9c7bf;--muted:#8d8b84;--line:#2f2e2b;--acc:#5b9bf0;--warnbg:#3a2d12;--warn:#f0b752;--alertbg:#3d1714;--alert:#ff9b8f}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
.bar{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar b{font-size:16px}.bar .when{color:var(--muted);font-size:12px}.sp{flex:1}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-size:15px;padding:12px 22px;border-radius:12px}
.badge{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:650}.badge.alert{background:var(--alertbg);color:var(--alert)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.center{max-width:420px;margin:18vh auto 0;padding:0 16px;text-align:center}.center h1{font-size:22px;margin:0 0 6px}.center p{color:var(--ink2);margin:0 0 22px}
.msg{color:var(--muted);font-size:13px;margin-top:14px;min-height:1.5em}
iframe{display:block;width:100%;border:0;min-height:80vh;background:var(--bg)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="login" class="center" hidden>
  <h1>자동투자 대시보드</h1>
  <p>상지홈 GitHub 계정으로 로그인하면 보입니다.</p>
  <button class="primary" id="go">GitHub로 로그인</button>
  <div class="msg" id="msg"></div>
</div>
<div id="view" hidden>
  <div class="bar">
    <b>자동투자</b><span class="when" id="when"></span><span id="badges"></span><span class="sp"></span>
    <button id="reload" title="새로 불러오기">새로고침</button>
  </div>
  <iframe id="frame" title="자동투자 대시보드" sandbox="allow-same-origin"></iframe>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js" integrity="sha384-AkNSQdptcXlJ0/NBZc4qGk86cDVXcCevwoWgEKIpHOEfbvlXGLlIkimQtONt8KNf" crossorigin="anonymous"></script>
<script>
// 상지홈 로그인 셸(household-app)과 같은 프로젝트·같은 저장 키 → 같은 사이트(jihoonlee91.github.io)에서 상지홈에 로그인돼 있으면 그대로 이어짐
const AUTH_KEY = "sb-jdidzokxoaxqcnraowyu-auth-token", SB_URL = "https://jdidzokxoaxqcnraowyu.supabase.co", SB_KEY = "sb_publishable_sgaob3nqRHgAaKBs_4yclw_-Wq7stKH";
const $ = id => document.getElementById(id);
const msg = t => { $("msg").textContent = t; };
if (!window.supabase) { $("login").hidden = false; msg("서버 연결 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."); throw new Error("no supabase"); }
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { flowType: "implicit", persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: AUTH_KEY, lock: async (_n, _t, fn) => await fn() } });
const STALE_MIN = 75;  // 집 PC가 30분마다 올림 → 75분 넘게 없으면 PC·서비스 확인
let lastAt = null, lastSummary = null;

function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? "방금" : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.floor(m / 60)}시간 ${m % 60}분 전` : `${Math.floor(m / 1440)}일 전`;
}

function fit() {  // 안쪽 화면 높이에 맞춰 늘림(스크롤은 바깥 한 곳에서만)
  try { const d = $("frame").contentDocument; if (d && d.documentElement) $("frame").style.height = (d.documentElement.scrollHeight + 8) + "px"; } catch (_) {}
}

function renderBadges(s, at) {
  const b = [];
  if (s && s.stop) b.push("<span class='badge alert'>⛔ 정지</span>");
  if (Date.now() - at > STALE_MIN * 60000) b.push("<span class='badge warn'>갱신 끊김 — 집 PC 확인</span>");
  $("badges").innerHTML = b.join(" ");
  $("when").textContent = `${new Date(at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })} 기준 · ${ago(at)}`;
}

async function load() {
  const { data, error } = await sb.from("autotrade_snapshots").select("at,summary,html").order("at", { ascending: false }).limit(1).maybeSingle();
  if (error) { $("when").textContent = "불러오기 실패: " + error.message; return; }
  if (!data) { $("view").hidden = true; $("login").hidden = false; msg("볼 수 있는 자료가 없어요. 상지홈 구성원 계정인지 확인해 주세요."); return; }
  const at = Date.parse(data.at);
  lastSummary = data.summary;
  renderBadges(data.summary, at);
  if (at !== lastAt) { lastAt = at; $("frame").srcdoc = data.html; }
}

async function finishOAuthReturn() {  // 돌아온 주소 #access_token=… 을 직접 세션으로
  const p = new URLSearchParams(location.hash.slice(1));
  const at = p.get("access_token"), rt = p.get("refresh_token");
  if (p.get("error_description")) msg("로그인 실패: " + p.get("error_description"));
  if (at && rt) await sb.auth.setSession({ access_token: at, refresh_token: rt });
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}

async function start() {
  await finishOAuthReturn();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("view").hidden = true; $("login").hidden = false; return; }
  $("login").hidden = true; $("view").hidden = false;
  await load();
}

$("go").onclick = async () => {
  $("go").disabled = true; msg("GitHub 로그인으로 이동 중…");
  const { data, error } = await sb.auth.signInWithOAuth({ provider: "github", options: { redirectTo: location.origin + location.pathname, skipBrowserRedirect: true } });
  if (error || !data?.url) { msg("로그인 주소를 만들지 못했어요: " + (error?.message || "")); $("go").disabled = false; return; }
  location.assign(data.url);
};
$("reload").onclick = () => load();
$("frame").addEventListener("load", () => { fit(); setTimeout(fit, 300); });
addEventListener("resize", fit);
setInterval(() => { if (!document.hidden && !$("view").hidden) load(); }, 5 * 60000);
setInterval(() => { if (lastAt) renderBadges(lastSummary, lastAt); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("view").hidden) load(); });
start().catch(e => { $("login").hidden = false; msg("오류: " + e.message); });
</script>
</body>
</html>
